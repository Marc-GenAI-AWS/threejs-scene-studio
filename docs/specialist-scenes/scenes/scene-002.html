<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ---- ../contract/runtime.js ----

/* ═══════════════════════════════════════════════════════════════════════
   SCENE CONTRACT — shared runtime (v1)
   The scene-agnostic engine every scene boots against. See SCENE_CONTRACT.md.
   Provides: uniform helpers, a seeded RNG, a state machine (enumerated OR
   factored manifest), and the assembler loop. A scene supplies a `sceneDef`
   (uniforms, layer classes, camera, state resolver, per-frame apply) to boot().
   ═══════════════════════════════════════════════════════════════════════ */

/* uniform helpers — a ShaderMaterial's uniforms is uniformsFor({...locals}) */
const F  = (v) => ({ value: v });
const C3 = () => ({ value: new THREE.Color() });
const V3 = (x = 0, y = 0, z = 0) => ({ value: new THREE.Vector3(x, y, z) });
const uniformsFor = (U, extra = {}) => ({ ...U, ...extra });

/* deterministic RNG (park–miller); no Math.random in scene code */
function makeRNG(seed = 7) {
  let s = (seed >>> 0) || 1;
  const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const rr = (a, b) => a + (b - a) * rnd();
  return { rnd, rr };
}

/* cur → target exponential interpolation of every visual parameter.
   `resolve(name)` returns a fresh target object (numbers, THREE.Color, THREE.Vector3).
   Colors/Vectors lerp via .lerp; numbers lerp arithmetically. */
class StateMachine {
  constructor({ initial, resolve, rate = 1.2, onApply }) {
    this.resolve = resolve; this.rate = rate; this.onApply = onApply;
    this.cur = {}; this.target = {};
    this.setState(initial, true);
  }
  setState(name, instant = false) {
    const t = this.resolve(name);
    for (const k in t) if (!(k in this.cur)) { const v = t[k]; this.cur[k] = (v && v.clone) ? v.clone() : v; }
    this.target = t;
    if (instant) for (const k in t) { const v = t[k]; this.cur[k] = (v && v.clone) ? v.clone() : v; }
  }
  tick(dt, t, ctx) {
    const k = 1 - Math.exp(-dt * this.rate), cur = this.cur, tg = this.target;
    for (const key in tg) {
      const c = cur[key], target = tg[key];
      if (typeof c === 'number') cur[key] = c + (target - c) * k;
      else if (c && c.lerp) c.lerp(target, k);
    }
    if (this.onApply) this.onApply(cur, ctx, t);
  }
}

/* boot the frozen skeleton: renderer, scene, camera, layers[], main loop.
   sceneDef: { meta, buildUniforms(), resolveState(name), initialState(),
               applyToUniforms(cur,ctx,t), layers:[Class], camera:Class,
               postfx?:Class, setupUI?(ctx,sm), onHashChange?(sm) } */
function boot(canvas, sceneDef) {
  const meta = sceneDef.meta || {};
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, meta.pixelRatio ?? 2));
  renderer.setSize(innerWidth, innerHeight);
  if (meta.toneMapping && THREE[meta.toneMapping]) renderer.toneMapping = THREE[meta.toneMapping];

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(meta.fov ?? 55, innerWidth / innerHeight, meta.near ?? 0.5, meta.far ?? 10000);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const { rnd, rr } = makeRNG(meta.seed ?? 7);
  const U = sceneDef.buildUniforms();
  const ctx = { THREE, renderer, scene, camera, U, rnd, rr, reducedMotion, cur: null };

  const sm = new StateMachine({
    initial: sceneDef.initialState(),
    resolve: (name) => sceneDef.resolveState(name),
    rate: meta.rate ?? 1.2,
    onApply: (cur, c, t) => sceneDef.applyToUniforms(cur, c, t),
  });
  ctx.cur = sm.cur;

  // scene-level setup (background, renderer tweaks) before layers are built
  if (sceneDef.setup) sceneDef.setup(ctx);

  const layers = (sceneDef.layers || []).map((L) => new L(ctx));
  const rig = sceneDef.camera ? new sceneDef.camera(ctx) : null;
  const post = sceneDef.postfx ? new sceneDef.postfx(ctx) : null;

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); if (post && post.resize) post.resize(innerWidth, innerHeight);
  });
  addEventListener('hashchange', () => sceneDef.onHashChange ? sceneDef.onHashChange(sm) : sm.setState(location.hash.slice(1)));
  if (sceneDef.setupUI) sceneDef.setupUI(ctx, sm);

  const clock = new THREE.Clock(); let t = 0;
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05); t += dt;
    U.uTime.value = t;
    sm.tick(dt, t, ctx);
    if (rig) rig.update(dt, t, ctx);
    for (const l of layers) if (l.update) l.update(dt, t);
    if (post) post.render(); else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
  return { ctx, sm, layers, rig, post };
}

// ---- field.js ----

// High Park constants + the shared ground field. groundH is the ONE floor
// function used by the mesh, grass, rocks, horses and camera alike (SCENE_CONTRACT §6).

const SADDLE = new THREE.Vector3(0, 38, -340);   /* the gap the light falls through */
const BASIN_R = 200;                             /* prairie extent */

const hashJ = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y); let xf = x - xi, yf = y - yi;
  xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
  const a = hashJ(xi, yi), b = hashJ(xi + 1, yi), c = hashJ(xi, yi + 1), d = hashJ(xi + 1, yi + 1);
  return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
}
const fbmJ = (x, y, o = 4) => { let a = 0.5, s = 0; for (let i = 0; i < o; i++) { s += a * vnoise2(x, y); x = x * 2.03 + 1.3; y = y * 2.01 + 0.7; a *= 0.5; } return s; };

// domain: the basin, roughly |x|<500, -480<z<130 (peaks apron included);
// range: ≈ -8 in the hollows up to ~+24 at the peak apron rim. Owned by Prairie.
const groundH = (x, z) => {
  const roll = fbmJ(x * 0.011, z * 0.011, 4) * 12 - 6 + Math.sin(x * 0.05) * 1.2;
  const apron = THREE.MathUtils.clamp((-z - 150) / 130, 0, 1); const hollow = -2.5 * Math.exp(-((x - 35) ** 2 + (z + 60) ** 2) / 2400);
  return roll + apron * apron * 30 + hollow;   /* apron caps at a low rim; Peaks supplies the summits */
};

// peak ridge profile (also drives the silhouette ranks)
const ridged = (x, s) => { let a = 0.5, f = 1, sum = 0, w = 1;
  for (let i = 0; i < 6; i++) { let n = 1 - Math.abs(vnoise2(x * f + s * 13.7, s * 7.1) * 2 - 1); n = n * n * w; w = Math.min(1, n * 1.7); sum += n * a; f *= 2.1; a *= 0.55; } return sum; };

// ---- prelude.glsl.js ----

// High Park GLSL prelude. G = CORE noise/fog + scene FIELDS (windAt, cloudShad,
// shaftMask) shared by every layer so one state moves the whole basin.

const G = /* glsl */`
uniform float uTime; uniform vec3 uSkyTop, uSkyHorizon, uSunC; uniform float uSunI; uniform vec3 uSunDir;
uniform vec3 uFogC; uniform float uFogD, uWind, uCloud, uShadowAmt, uShaft, uFlash; uniform vec3 uShaftDir, uSaddle;
const vec3 FLASH_C = vec3(0.78, 0.84, 1.0);   /* cold blue-white lightning light */
float hash1(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float noise3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash1(i), hash1(i+vec3(1,0,0)), f.x), mix(hash1(i+vec3(0,1,0)), hash1(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash1(i+vec3(0,0,1)), hash1(i+vec3(1,0,1)), f.x), mix(hash1(i+vec3(0,1,1)), hash1(i+vec3(1,1,1)), f.x), f.y), f.z); }
float fbm3(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise3(p); p = p * 2.03 + 1.7; a *= 0.5; } return s; }
float fbm2(vec2 p){ return fbm3(vec3(p, 0.37)); }
/* wind field: broad gusts + fine ripples travelling east (+x); every swaying thing samples this */
float windAt(vec2 xz, float t){ return (fbm2(xz * 0.020 - vec2(t * 0.50, t * 0.06)) * 0.75
  + fbm2(xz * 0.11 - vec2(t * 1.5, 0.0)) * 0.35 + 0.18) * uWind; }
/* cloud-shadow factor: 1 in sun, dips where cumulus pass; shared by turf, grass, herd, rocks */
float cloudShad(vec3 p){ return 1.0 - uShadowAmt * 0.6 *
  smoothstep(0.16, 0.5, fbm2(p.xz * 0.0045 + vec2(uTime * 0.014, uTime * 0.004))); }
/* the hero: crepuscular corridor falling from the saddle along uShaftDir */
float shaftMask(vec3 p){
  vec3 d = p - uSaddle; float h = dot(d, uShaftDir); vec3 q = d - h * uShaftDir;
  float r = length(q.xz * vec2(1.0, 2.2)) / (18.0 + h * 0.18);                 /* widening elliptical corridor */
  float blades = 0.55 + 0.45 * fbm2(vec2(q.x * 0.14 + 5.0, uTime * 0.05));     /* it is made of separate blades */
  return uShaft * smoothstep(1.1, 0.35, r) * smoothstep(-6.0, 30.0, h) * exp(-h * 0.006) * blades; }
/* valley haze: denser low, tinted by state; every material calls this last */
vec3 fog(vec3 col, vec3 p){ float d = distance(p, cameraPosition);
  float alt = clamp((p.y + 6.0) / 130.0, 0.0, 1.0);
  float f = 1.0 - exp(-uFogD * d * (1.15 - 1.0 * alt));
  return mix(col, uFogC, clamp(f, 0.0, 0.95)); }
float fogAtt(vec3 p){ float d = distance(p, cameraPosition); float alt = clamp((p.y + 6.0) / 130.0, 0.0, 1.0);
  return exp(-uFogD * d * (1.15 - 1.0 * alt)); }
`;

const TAIL = /* glsl */`
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

const VERT_WORLD = /* glsl */`
varying vec3 vP, vN;
void main(){
  #ifdef USE_INSTANCING
  mat4 m = modelMatrix * instanceMatrix;
  #else
  mat4 m = modelMatrix;
  #endif
  vec4 wp = m * vec4(position, 1.0);
  vP = wp.xyz; vN = normalize(mat3(m) * normal); gl_Position = projectionMatrix * viewMatrix * wp; }`;

/* base lit-matter fragment: albedo mottled by fbm, lit by sun×cloudShad + sky ambient + shaft boost */
const FRAG_MATTER = G + /* glsl */`
varying vec3 vP, vN; uniform vec3 uBase; uniform float uMottle;
void main(){ vec3 p = vP;
  vec3 n = normalize(normalize(vN) + 0.4 * vec3(noise3(p * 0.8 + 1.0) - 0.5, noise3(p * 0.8 + 2.0) - 0.5, noise3(p * 0.8 + 3.0) - 0.5));
  float m1 = fbm3(p * 0.35), m2 = noise3(p * 3.0);
  vec3 base = uBase * (1.0 - uMottle * 0.4 + uMottle * 0.8 * m1) * (0.82 + 0.28 * m2);
  float lam = max(dot(n, normalize(uSunDir)), 0.0);
  float sm = shaftMask(p), cs = cloudShad(p);
  vec3 skyFill = mix(uSkyHorizon, uSkyTop, 0.5) * (0.30 + 0.22 * max(n.y, 0.0));
  vec3 light = skyFill + uSunC * uSunI * lam * (0.5 + 0.6 * cs) + uSunC * sm * (0.4 + 0.6 * lam) + FLASH_C * uFlash * (0.7 + 0.6 * max(n.y, 0.0));
  gl_FragColor = vec4(fog(base * light, p), 1.0);` + TAIL;

// ---- materials.js ----

// Base lit-matter material factory (rocks, horses). SCENE_CONTRACT §5.
const matterMat = (ctx, base, opts = {}) => new THREE.ShaderMaterial({
  uniforms: uniformsFor(ctx.U, { uBase: { value: new THREE.Color(...base) }, uMottle: F(opts.mottle ?? 1) }),
  vertexShader: VERT_WORLD, fragmentShader: FRAG_MATTER, side: opts.side ?? THREE.FrontSide });

// ---- layers/atmosphere.js (override: /opt/ml/checkpoints/phase1/director_demo-d/scene-002/sky.js) ----

// High Park — SKY DOME layer. Fair-weather cumulus, crisp sun, crepuscular rays, halo.

const VERT = /* glsl */`
varying vec3 vDir;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vDir = wp.xyz - cameraPosition;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;

const FRAG_BODY = /* glsl */`
varying vec3 vDir;
uniform float uStars;

// cumulus base + detail, coverage 0..1
float cloud(vec3 d, float cov, float wind){
  float n = fbm3(d * 1.2 + vec3(wind, wind * 0.3, 0.0));
  float base = smoothstep(0.72, 0.92, n);
  float det = fbm3(d * 3.8 + vec3(wind * 0.6, wind * 0.3, 0.0));
  float th = mix(0.88, 0.62, cov);
  float c = smoothstep(th, th + 0.22, base * (1.0 - det * 0.6));
  return c;
}

void main(){
  vec3 d  = normalize(vDir);
  float h = d.y;
  vec3 sd = normalize(uSunDir);
  float up = clamp(h, 0.0, 1.0);
  float ang = acos(dot(d, sd));
  float sunUp = clamp(dot(sd, vec3(0.0, 1.0, 0.0)), 0.0, 1.0);

  // --- base gradient + horizon haze ---
  vec3 col = mix(uSkyHorizon, uSkyTop, pow(up, 0.42));
  col = mix(col, uFogC, smoothstep(0.0, -0.12, h));
  col = mix(col, uFogC, smoothstep(0.0, 0.12, uFogD));

  // --- stars (only when the palette is dark) ---
  float dark = 1.0 - max(max(uSkyTop.r, uSkyTop.g), uSkyTop.b);
  float st = dark * uStars * smoothstep(0.0, 0.12, h);
  float stn = hash1(floor(d * 220.0));
  col += vec3(stn) * st * 0.65;

  // --- sun: disc + tight warm glow + faint halo ring ---
  float disc = smoothstep(0.99965, 0.99992, ang);
  float glow = exp(-ang * 60.0);
  float ring = exp(-pow((ang - 0.085) / 0.025, 2.0)) * 0.12;
  vec3 sunCol = uSunC * uSunI;
  col += sunCol * (disc * 3.5 + glow * 1.2 + ring);

  // --- fair-weather cumulus ---
  float cov = uCloud;
  float cl = cloud(d, cov, uWind);
  vec3 cc = mix(uFogC, uSkyTop, 0.5) * (0.75 + 0.25 * pow(up, 2.0));
  cc = mix(cc, uSunC * 0.85, pow(sunUp, 2.0) * 0.6);
  cc = mix(cc, uFogC, 0.45 * (1.0 - cov));  // thin veil over the horizon
  col = mix(col, cc, cl * 0.95);

  // --- crepuscular rays fanning from the sun's direction ---
  vec3 s = normalize(uSunDir);
  vec3 q = normalize(vec3(1.0, 0.0, 0.0) + vec3(0.0, 1.0, 0.0) + s);
  vec3 r = cross(s, q);
  float phi = acos(dot(d, s));
  float ang2 = acos(dot(d, q));
  float ray = pow(max(ang2, 0.0), 6.0) * exp(-phi * 3.5) * uShaft;
  col += sunCol * ray * 0.12;

  // --- lightning ---
  col += FLASH_C * uFlash * (0.25 + 0.75 * cl);

  gl_FragColor = vec4(col, 1.0);
`;

class Atmosphere {
  constructor(ctx) {
    const { THREE, scene, U } = ctx;
    this.U = U;
    const geo = new THREE.SphereGeometry(1200, 48, 32);
    const mat = new THREE.ShaderMaterial({
      uniforms: uniformsFor(U, { uStars: { value: 1.0 } }),
      vertexShader: VERT,
      fragmentShader: G + FRAG_BODY + TAIL,
      side: THREE.BackSide,
      depthWrite: false,
      depthTest: false,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = -1000;
    scene.add(this.mesh);
  }
  update(dt, t) {
    // stars fade in as the palette darkens
    const sky = this.U.uSkyTop && this.U.uSkyTop.value;
    if (sky) {
      const lum = 0.2126 * sky.r + 0.7152 * sky.g + 0.0722 * sky.b;
      const target = Math.max(0, Math.min(1, (0.04 - lum) / 0.08));
      const s = this.mesh.material.uniforms.uStars;
      s.value += (target - s.value) * Math.min(1, dt * 2.0);
    }
  }
}

// ---- layers/peaks.js ----

/* ═══ COMPONENT: Peaks ═══
   Ridged heightfield ring behind the basin with snow-by-altitude (per-vertex,
   not per-triangle, so nothing speckles) and two silhouette ranks in the haze.
   Owns its snow/rock colour uniforms (published from cur each frame). */
class Peaks {
  constructor(ctx) {
    const { scene, U } = ctx;
    this.ctx = ctx;
    /* near range: a smooth ridged heightfield across the north of the basin.
       Summits are raised well clear of the haze; snow is computed per-vertex
       from world altitude (smooth, not per-triangle) so nothing speckles. */
    const W = 1100, D = 420, SEG_X = 480, SEG_Z = 130;
    const geo = new THREE.PlaneGeometry(W, D, SEG_X, SEG_Z); geo.rotateX(-Math.PI / 2); geo.translate(0, 0, -480);
    const pos = geo.attributes.position, aSnow = new Float32Array(pos.count);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const depth = THREE.MathUtils.clamp((-z - 250) / 240, 0, 1);                     /* 0 basin edge → 1 back */
      const gap = 1 - 0.72 * Math.exp(-((x - SADDLE.x) ** 2) / (2 * 46 * 46));          /* the saddle notch */
      const relief = Math.pow(ridged(x * 0.0030, 2.1) * gap, 1.3) + ridged(x * 0.0072, 5.7) * 0.28;
      const y = groundH(x, z) + depth * depth * (26 + relief * 300);
      pos.setY(i, y);
      aSnow[i] = THREE.MathUtils.smoothstep(y, 88, 175);                                /* clean snow line by height */
    }
    geo.setAttribute('aSnow', new THREE.BufferAttribute(aSnow, 1));
    geo.computeVertexNormals();
    const mat = new THREE.ShaderMaterial({
      uniforms: uniformsFor(U, { uSnow: C3(), uRock: C3() }),
      vertexShader: `varying vec3 vP, vN; varying float vSnow; attribute float aSnow;
      void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vP = wp.xyz; vN = normalize(mat3(modelMatrix) * normal); vSnow = aSnow;
        gl_Position = projectionMatrix * viewMatrix * wp; }`,
      fragmentShader: G + /* glsl */`
      varying vec3 vP, vN; varying float vSnow; uniform vec3 uSnow, uRock;
      void main(){ vec3 p = vP, n = normalize(vN);
        float slope = 1.0 - n.y;
        float snow = vSnow * smoothstep(0.72, 0.42, slope);                             /* snow slides off cliffs, softly */
        float strata = 0.5 + 0.5 * sin(p.y * 0.13 + fbm2(p.xz * 0.02) * 2.5);
        vec3 rock = uRock * (0.82 + 0.24 * strata);
        vec3 turf = mix(uRock, vec3(0.20, 0.26, 0.13), 0.7);                            /* grassy apron low down */
        vec3 base = mix(mix(turf, rock, smoothstep(20.0, 55.0, p.y)), uSnow, snow);
        float lam = max(dot(n, normalize(uSunDir)), 0.0);
        vec3 sky = mix(uSkyHorizon, uSkyTop, 0.5);
        vec3 light = sky * (0.42 + 0.26 * max(n.y, 0.0)) + uSunC * uSunI * lam * (0.55 + 0.45 * cloudShad(p));
        light += uSunC * uSunI * pow(lam, 2.5) * snow * 0.7;                            /* alpenglow / snow glare */
        gl_FragColor = vec4(fog(base * light, p), 1.0);` + TAIL });
    this.mat = mat; scene.add(new THREE.Mesh(geo, mat));

      p.y = groundH(p.x, p.z); h.root.rotation.y = h.h;
      h.ph += dt * h.spd * 2.4 / h.s;
      const mv = Math.min(1, h.spd / 1.2), amp = 0.25 + 0.4 * Math.min(1, h.spd / 3);
      h.legs.forEach((L, i) => {
        const q = h.ph + (i === 0 || i === 3 ? 0 : Math.PI) + (i > 1 ? 0.5 : 0);
        L.hip.rotation.x = Math.sin(q) * amp * mv;
        L.knee.rotation.x = Math.max(0, Math.sin(q + 1.3)) * amp * 1.4 * mv + 0.05;
      });
      h.body.position.y = Math.abs(Math.sin(h.ph)) * 0.07 * mv * h.s;
      h.body.rotation.x = Math.sin(h.ph * 2) * 0.02 * mv;
      if (h.gt < 0) { h.gz = !h.gz; h.gt = h.gz ? rr(3, 7) : rr(2, 5); }
      const tn = storm || !h.gz || h.spd > 1.2 ? 0.55 : 1.75 + Math.sin(t * 1.7 + h.ph) * 0.15;
      h.nk += (tn - h.nk) * Math.min(1, dt * 2); h.neck.rotation.x = h.nk;
      h.head.rotation.x = -h.nk * 0.55 + (h.gz ? 0.35 : 0);
      h.head.rotation.y = h.gz ? Math.sin(t * 0.6 + h.ph) * 0.15 : Math.sin(t * 0.9 + h.ph) * 0.08;
      h.tail.rotation.z = Math.sin(t * 2.3 + h.ph * 2) * (0.15 + 0.25 * mood);
      h.tail.rotation.x = -0.25 - 0.5 * Math.min(1, h.spd / 3);
    }
  }
}

/* ═══ COMPONENT: AirLife ═══
   A hawk circling the saddle thermal (big slow circles) and swallows low over
   the grass. Point sprites drawn as little winged dashes. */
class AirLife {
  constructor(ctx) {
    const { scene, U, rnd, rr, renderer } = ctx;
    this.ctx = ctx;
    const mk = (n, size) => {
      const g = new THREE.BufferGeometry(), p = new Float32Array(n * 3), s = new Float32Array(n);
      for (let i = 0; i < n; i++) { p.set([rr(-80, 80), rr(6, 30), rr(-120, 10)], i * 3); s[i] = rnd(); }
      g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('aSeed', new THREE.BufferAttribute(s, 1));
      const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
        uniforms: uniformsFor(U, { uVis: F(1), uPx: F(renderer.getPixelRatio()), uSize: F(size) }),
        vertexShader: `attribute float aSeed; uniform float uTime, uPx, uVis, uSize; varying float vA, vFlap;
        void main(){ vec3 p = position; float t = uTime * (0.5 + aSeed * 0.5) * ${size > 600 ? '0.22' : '1.0'};
          p.x += sin(t + aSeed * 6.0) * ${size > 600 ? '38.0' : '26.0'}; p.z += cos(t * 1.2 + aSeed * 4.0) * ${size > 600 ? '26.0' : '18.0'};
          p.y += sin(t * 2.2 + aSeed) * 2.5;
          vFlap = sin(uTime * (${size > 600 ? '1.4' : '11.0'} + aSeed * 4.0)); vA = uVis * step(aSeed, uVis);
          vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = uPx * uSize / max(-mv.z, 1.0); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `varying float vA, vFlap; void main(){ vec2 c = gl_PointCoord - 0.5;
          float wy = 0.15 * vFlap * (1.0 - abs(c.x) * 2.2);
          float a = smoothstep(0.05, 0.0, abs(c.y - wy) - 0.013) * step(abs(c.x), 0.44);
          gl_FragColor = vec4(vec3(0.10, 0.09, 0.10), a * vA); }` });
      const pts = new THREE.Points(g, mat); scene.add(pts); return mat;
    };
    this.swallows = mk(10, 420);
    this.hawkMat = mk(1, 1500);                       /* one hawk, big slow circles, near-fixed wings */
  }
  update() { const cur = this.ctx.cur; this.swallows.uniforms.uVis.value = Math.min(cur.hawk * 1.4, 1); this.hawkMat.uniforms.uVis.value = cur.hawk > 0.15 ? 1 : 0; }
}

/* ═══ COMPONENT: Fluff ═══

class Fluff {
  constructor(ctx) {
    const { scene, U, rnd, rr, renderer } = ctx;
    this.ctx = ctx;
    const N = 1600, p = new Float32Array(N * 3), s = new Float32Array(N);
    for (let i = 0; i < N; i++) { p.set([rr(-110, 110), rr(0.5, 22), rr(-150, 25)], i * 3); s[i] = rnd(); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('aSeed', new THREE.BufferAttribute(s, 1));
    const pts = new THREE.Points(g, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: uniformsFor(U, { uFluff: F(0.5), uPx: F(renderer.getPixelRatio()) }),
      vertexShader: G + /* glsl */`
      attribute float aSeed; uniform float uFluff, uPx; varying float vB, vA;
      void main(){ vec3 p = position;
        p.x = mod(p.x + uTime * (1.5 + 2.5 * aSeed) * (0.4 + uWind) + 110.0, 220.0) - 110.0;
        p.y += sin(uTime * 0.7 + aSeed * 20.0) * 1.6; p.z += sin(uTime * 0.23 + aSeed * 9.0) * 4.0;
        float sm = shaftMask(p);
        vB = (0.10 + 0.25 * uSunI * cloudShad(p) + 2.2 * sm) * fogAtt(p);
        vA = uFluff * step(aSeed, uFluff) * (0.5 + 1.5 * sm);

        gl_Position = projectionMatrix * mv; }`,
      fragmentShader: /* glsl */`
      varying float vB, vA;
      void main(){ float r = length(gl_PointCoord - 0.5) * 2.0; float m = smoothstep(1.0, 0.3, r);
        gl_FragColor = vec4(vec3(1.0, 0.96, 0.86) * vB, m * vA * 0.55);` + TAIL }));

/* ═══ COMPONENT: Rain (effects) ═══
   Wind-sheared streaks wrapped around the moving camera so they always fill the
   view; gated by cur.rain (inert outside the storm). */
class Rain {
  constructor(ctx) {
    const { scene, U, rnd, rr, renderer } = ctx;
    this.ctx = ctx;
    const N = 9000, p = new Float32Array(N * 3), s = new Float32Array(N);
    for (let i = 0; i < N; i++) { p[i * 3] = rr(-70, 70); p[i * 3 + 1] = rr(0, 60); p[i * 3 + 2] = rr(-95, 30); s[i] = rnd(); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('aSeed', new THREE.BufferAttribute(s, 1));
    this.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: uniformsFor(U, { uRain: F(0), uPx: F(renderer.getPixelRatio()) }),
      vertexShader: /* glsl */`attribute float aSeed; uniform float uTime, uRain, uWind, uPx; varying float vA;
      void main(){ vec3 p = position;
        float fall = mod(p.y - uTime * (34.0 + aSeed * 16.0), 60.0);
        p.y = fall; p.x += (60.0 - fall) * 0.18 * (0.4 + uWind);                       /* wind shear leans the streaks */
        /* keep the rain column wrapped around the moving camera so it always fills the view */
        p.x = mod(p.x - cameraPosition.x + 70.0, 140.0) - 70.0 + cameraPosition.x;
        p.z = mod(p.z - cameraPosition.z + 70.0, 140.0) - 70.0 + cameraPosition.z;
        vA = uRain * step(aSeed, uRain);
        vec4 mv = viewMatrix * vec4(p, 1.0);
        gl_PointSize = uPx * clamp(120.0 / max(-mv.z, 1.0), 3.0, 22.0) * (0.7 + 0.6 * aSeed);
        gl_Position = projectionMatrix * mv; }`,
      fragmentShader: /* glsl */`varying float vA;
      void main(){ vec2 c = gl_PointCoord - 0.5;
        float streak = smoothstep(0.5, 0.0, abs(c.x) * 7.0) * smoothstep(0.5, 0.05, abs(c.y));   /* tall thin dash */
        gl_FragColor = vec4(vec3(0.75, 0.80, 0.88), streak * vA * 0.45); }` });
    const pts = new THREE.Points(g, this.mat); pts.renderOrder = 7; pts.frustumCulled = false; scene.add(pts);
  }
  update() { this.mat.uniforms.uRain.value = this.ctx.cur.rain; }
}

const smoothstep2 = (x, a, b) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ═══ COMPONENT: Lightning (effects) ═══
   A jagged additive bolt in the saddle gap + synthesized thunder, gated to the
   storm state. Writes the shared uFlash channel (sky/grass/prairie/matter read
   it; PostFX boosts bloom/exposure from it). Note: this.ctx is the AudioContext,
   so scene refs are held separately. */
class Lightning {
  constructor(sctx) {
    const { scene, U, rr } = sctx;
    this.U = U; this.camera = sctx.camera; this.rnd = sctx.rnd; this.rr = rr; this.cur = sctx.cur;
    this.env = 0; this.next = rr(2.5, 6); this.t0 = -100; this.boltSeed = 0; this.ctx = null;
    /* a jagged bolt drawn on an additive plane standing in the saddle gap */
    const g = new THREE.PlaneGeometry(34, 120, 1, 1);
    this.bolt = new THREE.Mesh(g, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: uniformsFor(U, { uEnv: F(0), uSeed: F(0) }),
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: G + /* glsl */`uniform float uEnv, uSeed; varying vec2 vUv;
      void main(){ if (uEnv < 0.02) discard;
        float y = 1.0 - vUv.y;                                                        /* strike from the top down */
        /* jagged centreline: low-freq wander + a couple of sharp kinks */
        float cx = 0.5 + 0.20 * (fbm2(vec2(y * 9.0 + uSeed * 40.0, uSeed)) - 0.47)
                       + 0.10 * (fract(y * 3.0 + uSeed) - 0.5)
                       + 0.03 * sin(y * 80.0 + uSeed * 12.0);
        float d = abs(vUv.x - cx);
        float core = smoothstep(0.022, 0.0, d);                                       /* crisp white filament */
        float glow = smoothstep(0.13, 0.0, d) * 0.35;                                 /* tight halo */
        /* two forked branches peeling off partway down */
        float bx = cx + 0.22 * sign(fract(uSeed * 9.0) - 0.5);
        float branch = smoothstep(0.016, 0.0, abs(vUv.x - bx * 0.5 - cx * 0.5)) * smoothstep(0.35, 0.05, abs(y - 0.6)) * step(0.5, fract(y * 5.0 + uSeed));
        float a = (core + glow + branch * 0.7) * uEnv * smoothstep(0.0, 0.05, vUv.y) * smoothstep(1.0, 0.92, vUv.y);
        gl_FragColor = vec4(FLASH_C * (3.0 + core * 6.0), a); }` }));
    this.bolt.position.set(SADDLE.x - 60, SADDLE.y + 55, SADDLE.z + 70); this.bolt.renderOrder = 8; scene.add(this.bolt);
    /* thunder is synthesized (no audio assets); only after a user gesture unlocks audio */
    const unlock = () => { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} };
    window.addEventListener('pointerdown', unlock, { once: false });
  }
  strike() { this.t0 = this.U.uTime.value; this.boltSeed = this.rnd(); this.bolt.material.uniforms.uSeed.value = this.boltSeed;
    this.bolt.position.x = SADDLE.x + (this.rnd() < 0.5 ? this.rr(-78, -34) : this.rr(34, 78)); this.thunder(); }   /* off to one side, over the peaks */
  thunder() {
    try {
      const ctx = this.ctx; if (!ctx || ctx.state !== 'running') return;
      const now = ctx.currentTime, delay = 0.5 + this.rnd() * 1.6, dur = 1.6 + this.rnd() * 1.4;   /* delay ≈ distance to the strike */
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate), ch = buf.getChannelData(0);
      let last = 0; for (let i = 0; i < ch.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; ch[i] = last * 3.2; }   /* brown noise */
      const src = ctx.createBufferSource(); src.buffer = buf;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240; lp.Q.value = 0.7;
      const gn = ctx.createGain(); gn.gain.setValueAtTime(0, now + delay);
      gn.gain.linearRampToValueAtTime(0.45, now + delay + 0.08);
      gn.gain.exponentialRampToValueAtTime(0.0008, now + delay + dur);
      src.connect(lp); lp.connect(gn); gn.connect(ctx.destination); src.start(now + delay); src.stop(now + delay + dur);
    } catch (e) {}
  }
  update(dt, t) {
    const cur = this.cur;
    if (cur.rain > 0.5) { this.next -= dt; if (this.next <= 0) { this.strike(); this.next = this.rr(3.5, 9); } }
    const e = t - this.t0;
    /* double-flicker envelope with a fast decay */
    this.env = e < 0.45 ? Math.max(0, Math.exp(-e * 7.0) * (0.55 + 0.45 * Math.sin(e * 85.0)) * Math.min(1, e / 0.02)) * cur.rain : 0;
    this.U.uFlash.value = this.env;
    const be = smoothstep2(e, 0.0, 0.015) * (1.0 - smoothstep2(e, 0.10, 0.34));   /* a crisp stroke, held ~0.3s */
    this.bolt.material.uniforms.uEnv.value = (e >= 0.0 && e < 0.45 ? be : 0.0) * cur.rain;
    this.bolt.lookAt(this.camera.position.x, this.bolt.position.y, this.camera.position.z);
  }
}

// ---- camera.js (override: /opt/ml/checkpoints/phase1/director_demo-d/scene-002/camera.js) ----

// CameraRig — "High Park": slow lateral dolly along the southern knoll, looking north
// toward the saddle, grass framing the bottom edge, deep space beyond. Steady, deliberate.
class CameraRig {
  constructor(ctx) {
    this.ctx = ctx;
    this.THREE = ctx.THREE;
    this.saddle = (typeof SADDLE !== 'undefined') ? SADDLE : new ctx.THREE.Vector3(0, 38, -340);
    this.pos = new ctx.THREE.Vector3();
    this.aim = new ctx.THREE.Vector3();
  }

  update(dt, t) {
    const { camera } = this.ctx;
    const w = (2 * Math.PI) / 120;           // ~2.5 deg/s lateral dolly, ~5 s for a full sweep
    const x = 16 * Math.sin(w * t);          // ±25 units from the southern knoll (stays inside -150..150)
    const z = 32 + 4 * Math.sin(0.17 * t);   // gentle drift toward the basin edge, never > 60
    const g = groundH(x, z);
    const y = g + 10.5 + 1.2 * Math.sin(0.25 * t + 0.7);  // eye height, always >= g + 1.5

    this.pos.set(x, y, z);
    camera.position.copy(this.pos);

    // Aim: the saddle, lifted a touch above its base so the ridge line sits across the middle
    // and sky fills the top third. Aim pitch is shallow so grass stays low in frame.
    const ax = x + 6 * Math.sin(0.11 * t + 1.4);       // a slow pan as the dolly moves
    const ay = this.saddle.y + 4 + 1.0 * Math.sin(0.13 * t);
    const az = this.saddle.z;
    this.aim.set(ax, ay, az);
    camera.lookAt(this.aim.x, this.aim.y, this.aim.z);
  }
}

/* ═══ COMPONENT: PostFX ═══
   Bloom + hand ACES/vignette; plain fallback. A lightning flash (the shared
   uFlash channel, written by Lightning) boosts bloom and exposure. */
class PostFX {
  constructor(ctx) {
    this.ctx = ctx;
    const { renderer, scene, camera } = ctx;
    try {
      this.composer = new EffectComposer(renderer); this.composer.addPass(new RenderPass(scene, camera));
      this.bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.5, 0.9); this.composer.addPass(this.bloom);
      this.out = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uExposure: F(1) },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform sampler2D tDiffuse; uniform float uExposure; varying vec2 vUv;
        vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
        void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb * uExposure; c = aces(c);
          float v = 1.0 - 0.26 * pow(length(vUv - 0.5) * 1.35, 2.5);
          gl_FragColor = vec4(pow(c * v, vec3(1.0 / 2.2)), 1.0); }` });
      this.composer.addPass(this.out); renderer.toneMapping = THREE.NoToneMapping;
    } catch (e) { console.warn('post-processing unavailable, plain render', e); this.composer = null; }
  }
  resize(w, h) { if (this.composer) { this.composer.setSize(w, h); this.bloom.setSize(w, h); } }
  render() {
    const { renderer, scene, camera, cur, U } = this.ctx;
    const flash = U.uFlash.value;   /* Lightning writes uFlash == its env; keep PostFX layer-independent */
    if (this.composer) { this.bloom.strength = cur.bloom + flash * 0.35; this.out.uniforms.uExposure.value = cur.exposure + flash * 0.42; this.composer.render(); }
    else { renderer.toneMappingExposure = cur.exposure + flash * 0.42; renderer.render(scene, camera); }
  }
}

  },

  applyToUniforms(cur, ctx) {
    const U = ctx.U;
    U.uSkyTop.value.copy(cur.skyTop); U.uSkyHorizon.value.copy(cur.skyHorizon); U.uSunC.value.copy(cur.sunC); U.uSunI.value = cur.sunI;
    U.uFogC.value.copy(cur.fog); U.uFogD.value = cur.fogD; U.uWind.value = cur.wind; U.uCloud.value = cur.cloud; U.uShadowAmt.value = cur.shadowAmt;
    U.uGrassA.value.copy(cur.grassA); U.uGrassB.value.copy(cur.grassB); U.uMist.value = cur.mist; U.uStars.value = cur.stars;
    /* the sun sits above the saddle; the shaft corridor leans with shaftTilt through the day */
    U.uSunDir.value.set(Math.sin(cur.shaftTilt) * 0.6, Math.max(cur.sunEl, 0.03), -0.9).normalize();
    U.uShaft.value = cur.shaft;
    U.uShaftDir.value.set(Math.sin(cur.shaftTilt), -0.80, 0.55).normalize();
  },

  layers: [Atmosphere, Peaks, Prairie, Grass, Outcrops, Mist, Shafts, Herd, AirLife, Fluff, Rain, Lightning],
  camera: CameraRig,
  postfx: PostFX,

  onHashChange(sm) { const name = STATES[location.hash.slice(1)] ? location.hash.slice(1) : ORDER[1]; sm.setState(name); showState(name); },

  setupUI(ctx, sm) {
    captionEl = document.getElementById('caption'); nav = document.getElementById('nav');
    ORDER.forEach((n) => { const b = document.createElement('button'); b.textContent = n; b.dataset.state = n; b.addEventListener('click', () => { location.hash = n; }); nav.appendChild(b); });
    showState(sceneDef.initialState(), true);
  },
};

// ---- caption + nav ----
let captionEl, nav;
function showState(name, instant = false) {
  nav.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.state === name));
  captionEl.classList.add('fade');
  setTimeout(() => { captionEl.textContent = STATES[name].caption; captionEl.classList.remove('fade'); }, instant ? 0 : 500);
}

boot(document.getElementById('scene'), sceneDef);

</script>
</body>
</html>
